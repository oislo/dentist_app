<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title or "Dentist Admin" }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="{{ url_for('dashboard') }}">Dentist Admin</a>
    <div class="navbar-nav">
      <a class="nav-link" href="{{ url_for('calendar_week') }}">Calendar</a>
      <a class="nav-link" href="{{ url_for('clients_list') }}">Clients</a>
      <a class="nav-link" href="{{ url_for('appointments_list') }}">Appointments</a>
      <a class="nav-link" href="{{ url_for('services_list') }}">Services</a>
    </div>
  </div>
</nav>

<div class="container my-4">
  {% with messages = get_flashed_messages(with_categories=True) %}
    {% if messages %}
      {% for category, msg in messages %}
        <div class="alert alert-{{ 'warning' if category == 'warning' else category }} alert-dismissible fade show" role="alert">
          {{ msg }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<script>
  document.querySelectorAll('input[data-datetime="1"]').forEach((el) => {
    flatpickr(el, {
      enableTime: true,
      time_24hr: true,
      dateFormat: "Y-m-d\TH:i",
      altInput: true,
      altFormat: "d/m/Y H:i",
      allowInput: true
    });
  });

  document.querySelectorAll('input[data-date="1"]').forEach((el) => {
    flatpickr(el, {
      enableTime: false,
      dateFormat: "Y-m-d",
      altInput: true,
      altFormat: "d/m/Y",
      allowInput: true
    });
  });
</script>
</body>
</html>
