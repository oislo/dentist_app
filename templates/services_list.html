{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="m-0">Services</h1>
  <a class="btn btn-primary" href="{{ url_for('service_new') }}">Add Service</a>
</div>

<div class="card"><div class="card-body">
  {% if services %}
    <div class="table-responsive">
      <table class="table table-sm align-middle">
        <thead><tr><th>Name</th><th>Default Price</th><th>Active</th><th class="text-end">Actions</th></tr></thead>
        <tbody>
          {% for s in services %}
            <tr>
              <td>{{ s.name }}</td>
              <td>{{ s.default_price|money }}</td>
              <td>{{ "Yes" if s.is_active else "No" }}</td>
              <td class="text-end">
                <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('service_edit', service_id=s.id) }}">Edit</a>
                <form method="post" action="{{ url_for('service_delete', service_id=s.id) }}" class="d-inline" onsubmit="return confirm('Delete this service?');">
                  <button class="btn btn-sm btn-outline-danger">Delete</button>
                </form>
              </td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  {% else %}
    <div class="text-muted">No services yet.</div>
  {% endif %}
</div></div>
{% endblock %}
