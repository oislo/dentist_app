{# Shared form helpers #}
{% macro form_errors(form) %}
  {% if form.errors %}
    <div class="alert alert-danger" role="alert">
      <ul class="mb-0">
        {% for name, errs in form.errors.items() %}
          {% for e in errs %}
            <li>{% if name and name in form %}{{ form[name].label.text }}: {% endif %}{{ e }}</li>
          {% endfor %}
        {% endfor %}
      </ul>
    </div>
  {% endif %}
{% endmacro %}
